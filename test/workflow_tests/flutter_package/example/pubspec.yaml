name: flutter_app_example
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_package:
    path: ..

dev_dependencies:
  # By path, so each self-test run analyzes with the lints of its own commit, not main's.
  dartender_lints:
    path: ../../../../lints
  dependency_validator: ^5.1.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
