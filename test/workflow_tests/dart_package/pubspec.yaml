name: dart_package
description: A starting point for Dart libraries or applications.
version: 1.0.0
repository: https://github.com/LahaLuhem/dartender

environment:
  sdk: ^3.13.4

dependencies:
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.17.1
  # By path, so each self-test run analyzes with the lints of its own commit, not main's.
  dartender_lints:
    path: ../../../lints
  # Exact on purpose: that's what marks a package as a generator here.
  json_serializable: 6.15.2
  test: ^1.25.6
