name: callers
description: A package repo's caller workflows, which run dartender's own, and its lint-checks.json.
version: 0.1.0

environment:
  mason: ^0.1.0

# scripts/setup/callers.sh passes every one of these.
vars:
  default_branch:
    type: string
    description: The branch the callers check pull requests into and pushes to.
  coveralls:
    type: boolean
    description: The coveralls input of dartender's ci.yml.
  min_coverage:
    type: number
    description: The min-coverage input of dartender's ci.yml.
  coverage_excludes:
    type: string
    description: The coverage-excludes input of dartender's ci.yml.
  # Its tags in lint-checks.json sit inline, since mason leaves a blank line for a tag on its own.
  shellcheck:
    type: boolean
    description: Whether lint-checks.json gets a ShellCheck check.
  shellcheck_paths:
    type: string
    description: The shell scripts that check runs on, as space-separated globs.
