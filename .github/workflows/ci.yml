name: CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder of the package to check. Only dartender's self-tests change it.
        type: string
        default: .
      min-coverage:
        description: The lowest line coverage that passes, in percent.
        type: number
        default: 95
      coverage-excludes:
        description: Space-separated globs to leave out of coverage, besides generated `*.g.dart`.
        type: string
        default: ""
      coveralls:
        description: Uploads coverage to Coveralls. Turn it off for a repo that isn't set up there.
        type: boolean
        default: true
      python-min-coverage:
        description: >-
          The lowest coverage benchmark/python's tests can have, in percent, or 0 for none. It
          needs the project's own --cov, without which nothing gets measured and anything passes.
        type: number
        default: 0

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    # paths-filter asks the API for a PR's changed files.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lint-checks: ${{ steps.detect.outputs.lint-checks }}
      lint-image: ${{ steps.detect.outputs.lint-image }}
      package: ${{ steps.detect.outputs.package }}
      flutter: ${{ steps.detect.outputs.flutter }}
      example: ${{ steps.detect.outputs.example }}
      example-tests: ${{ steps.detect.outputs.example-tests }}
      dependabot: ${{ steps.detect.outputs.dependabot }}
      python: ${{ steps.detect.outputs.python }}
      android-changed: ${{ steps.changes.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # `$/` is dartender at the running commit, where `./` would be the calling repo.
      - id: detect
        uses: $/actions/detect
        with:
          working-directory: ${{ inputs.working-directory }}
      - id: changes
        uses: dorny/paths-filter@v4
        with:
          token: ${{ github.token }}
          base: ${{ github.event.repository.default_branch }}
          predicate-quantifier: some
          # `actions/` only exists in dartender. Not the pubspecs: a bump there can bring native
          # code for any platform, or none.
          filters: |
            android:
              - '${{ inputs.working-directory }}/android/**'
              - '${{ inputs.working-directory }}/example/android/**'
              - '.github/workflows/ci.yml'
              - 'actions/setup-flutter/**'

  lint:
    name: ${{ matrix.check.name }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # Each linter reports on its own, so one failure doesn't cancel the rest.
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.lint-checks) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/actions/lint
        with:
          cmd: ${{ matrix.check.cmd }}
          image: ${{ needs.plan.outputs.lint-image }}
          working-directory: ${{ inputs.working-directory }}

  action-inputs:
    name: Action inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/actions/check-inputs
        with:
          working-directory: ${{ inputs.working-directory }}

  dependabot:
    name: Dependabot config
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/actions/dependabot
        with:
          pairs: ${{ needs.plan.outputs.dependabot }}
          working-directory: ${{ inputs.working-directory }}

  format:
    name: Format
    needs: plan
    if: needs.plan.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/actions/setup-flutter
        with:
          working-directory: ${{ inputs.working-directory }}
      - working-directory: ${{ inputs.working-directory }}
        run: dart format --output=none --set-exit-if-changed .

  analyze:
    name: Analyze
    needs: plan
    if: needs.plan.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Its `flutter pub get` resolves the example as well, so the analyzer covers both.
      - uses: $/actions/setup-flutter
        with:
          working-directory: ${{ inputs.working-directory }}
      - working-directory: ${{ inputs.working-directory }}
        run: dart analyze --fatal-infos --fatal-warnings .

  dependencies:
    name: Dependency validator
    needs: plan
    if: needs.plan.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/actions/setup-flutter
        with:
          working-directory: ${{ inputs.working-directory }}
      - working-directory: ${{ inputs.working-directory }}
        run: dart run dependency_validator

  dartdoc:
    name: Dartdoc
    needs: plan
    if: needs.plan.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/actions/setup-flutter
        with:
          working-directory: ${{ inputs.working-directory }}
      - uses: $/actions/dartdoc
        with:
          working-directory: ${{ inputs.working-directory }}

  test:
    name: Tests
    needs: plan
    if: needs.plan.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/actions/setup-flutter
        with:
          working-directory: ${{ inputs.working-directory }}
      - uses: $/actions/test
        with:
          working-directory: ${{ inputs.working-directory }}
          flutter: ${{ needs.plan.outputs.flutter }}
          min-coverage: ${{ inputs.min-coverage }}
          # Generated code has nothing to test, so it never counts.
          excludes: "**/*.g.dart ${{ inputs.coverage-excludes }}"
      # Also after a failed gate, so Coveralls shows the drop. An outage only turns this step red.
      - if: ${{ !cancelled() && inputs.coveralls }}
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ github.token }}
          file: ${{ inputs.working-directory }}/coverage/lcov.info
          format: lcov
          fail-on-error: true

  example-dependencies:
    name: Dependency validator (example)
    needs: plan
    if: needs.plan.outputs.example == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # At the root, since its `flutter pub get` resolves the example too.
      - uses: $/actions/setup-flutter
        with:
          working-directory: ${{ inputs.working-directory }}
      - working-directory: ${{ inputs.working-directory }}/example
        run: dart run dependency_validator

  example-test:
    name: Tests (example)
    needs: plan
    if: needs.plan.outputs.example-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/actions/setup-flutter
        with:
          working-directory: ${{ inputs.working-directory }}
      # The example doesn't ship, so its tests get no coverage gate.
      - working-directory: ${{ inputs.working-directory }}/example
        run: flutter test

  example-android:
    name: Android build (example)
    needs: plan
    if: needs.plan.outputs.example == 'true' && needs.plan.outputs.android-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          java-package: jdk
          set-default: true
          cache: gradle
      - uses: $/actions/setup-flutter
        with:
          working-directory: ${{ inputs.working-directory }}
      # Release, so R8's shrinking runs too, which a debug build skips.
      - working-directory: ${{ inputs.working-directory }}/example
        run: flutter build apk --release

  python-lint:
    name: Ruff lint
    needs: plan
    if: needs.plan.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/actions/setup-python-uv
        with:
          working-directory: ${{ inputs.working-directory }}/benchmark/python
      - working-directory: ${{ inputs.working-directory }}/benchmark/python
        run: uv run ruff check .

  python-format:
    name: Ruff format
    needs: plan
    if: needs.plan.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/actions/setup-python-uv
        with:
          working-directory: ${{ inputs.working-directory }}/benchmark/python
      - working-directory: ${{ inputs.working-directory }}/benchmark/python
        run: uv run ruff format --check .

  python-test:
    name: Pytest
    needs: plan
    if: needs.plan.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/actions/setup-python-uv
        with:
          working-directory: ${{ inputs.working-directory }}/benchmark/python
      - working-directory: ${{ inputs.working-directory }}/benchmark/python
        env:
          # Only with a gate, since pytest stops on the flag in a project without pytest-cov.
          PYTEST_ADDOPTS: >-
            ${{ inputs.python-min-coverage > 0
            && format('--cov-fail-under={0}', inputs.python-min-coverage) || '' }}
        run: uv run pytest

  # Every Dependabot bump, majors included. The required checks decide, and a merge isn't a release.
  auto-merge:
    name: Auto-merge
    # Only the self-test's fixture runs change working-directory, and they shouldn't touch the PR.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && inputs.working-directory == '.'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # With nothing required, gh merges on the spot instead, so a repo gets its ruleset first.
      - env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --rebase "$PR_URL"

  # The required check in every repo's ruleset, so don't rename it.
  ok:
    needs:
      - plan
      - lint
      - action-inputs
      - dependabot
      - format
      - analyze
      - dependencies
      - dartdoc
      - test
      - example-dependencies
      - example-test
      - example-android
      - python-lint
      - python-format
      - python-test
      - auto-merge
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: >-
            plan=${{ needs.plan.result }}
            lint=${{ needs.lint.result }}
            action-inputs=${{ needs.action-inputs.result }}
            dependabot=${{ needs.dependabot.result }}
            format=${{ needs.format.result }}
            analyze=${{ needs.analyze.result }}
            dependencies=${{ needs.dependencies.result }}
            dartdoc=${{ needs.dartdoc.result }}
            test=${{ needs.test.result }}
            example-dependencies=${{ needs.example-dependencies.result }}
            example-test=${{ needs.example-test.result }}
            example-android=${{ needs.example-android.result }}
            python-lint=${{ needs.python-lint.result }}
            python-format=${{ needs.python-format.result }}
            python-test=${{ needs.python-test.result }}
            auto-merge=${{ needs.auto-merge.result }}
        run: echo "$RESULTS"
      # A job skipped by its own `if` counts as a pass. Failed or cancelled doesn't.
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
