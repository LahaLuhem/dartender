name: Conventions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  branch:
    name: Branch name
    # Dependabot picks its own branch names, and dartender doesn't name branches after issues.
    # The PR's author, not the actor, so someone labelling a bot PR doesn't turn this back on.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]'
      && github.repository != 'LahaLuhem/dartender'
    runs-on: ubuntu-latest
    steps:
      # `$/` is dartender at the running commit, where `./` would be the calling repo.
      - uses: $/actions/branch-name
        with:
          branch: ${{ github.head_ref }}

  commits:
    name: Commit conventions
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the pull request's commits are there to read.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/actions/commit-conventions
        with:
          body: ${{ github.event.pull_request.body }}
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

  # The required check in every repo's ruleset, so don't rename it.
  ok:
    needs: [branch, commits]
    if: always()
    runs-on: ubuntu-latest
    # A PR's gates wait in line, so the one that finishes last also read the labels last.
    concurrency:
      group: conventions-ok-${{ github.event.pull_request.number }}
      queue: max
    # The label check reads the PR's labels through the API.
    permissions:
      pull-requests: read
    steps:
      - env:
          RESULTS: >-
            branch=${{ needs.branch.result }}
            commits=${{ needs.commits.result }}
        run: echo "$RESULTS"
      # Right before the verdict, since labels can change while the other jobs run. Dependabot and
      # dartender don't use sem-* labels.
      - if: >-
          github.event.pull_request.user.login != 'dependabot[bot]'
          && github.repository != 'LahaLuhem/dartender'
        uses: $/actions/sem-label
        with:
          repo: ${{ github.repository }}
          pr: ${{ github.event.pull_request.number }}
      # A job skipped by its own `if` counts as a pass. Failed or cancelled doesn't.
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
