name: Self-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: self-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # What the conventions gate asks for.
  pull-requests: read

jobs:
  # Dartender checks itself with the same workflow every package repo calls.
  ci:
    uses: ./.github/workflows/ci.yml
    # What ci.yml's Auto-merge job asks for. A run whose caller grants less won't start.
    permissions:
      contents: write
      pull-requests: write

  # And against packages laid out like the real repos, since dartender itself has no pubspec.
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        fixture: [dart_package, flutter_package]
    uses: ./.github/workflows/ci.yml
    # Here too, though the job skips, since GitHub checks grants before any `if:`.
    permissions:
      contents: write
      pull-requests: write
    with:
      working-directory: test/workflow_tests/${{ matrix.fixture }}
      # The fixtures aren't on Coveralls.
      coveralls: false
      # Low, just so the Python fixture's pytest runs with the gate on.
      python-min-coverage: 1

  # Publishing as well, all but the upload, which only a real release can test.
  publish:
    strategy:
      fail-fast: false
      matrix:
        fixture: [dart_package, flutter_package]
    uses: ./.github/workflows/publish.yml
    # What publish.yml's job asks for.
    permissions:
      contents: read
      id-token: write
    with:
      working-directory: test/workflow_tests/${{ matrix.fixture }}
      dry-run: true

  # The changelog line too, all but the commit. One fixture is enough, since cider doesn't care
  # what kind of package it's in.
  changelog:
    uses: ./.github/workflows/changelog.yml
    # What changelog.yml's jobs ask for.
    permissions:
      contents: read
      pull-requests: read
    with:
      working-directory: test/workflow_tests/dart_package
      dry-run: true
      # Stand-ins for a merged PR's, since dartender's own PRs carry no sem-* label.
      label: sem-change
      title: A line from dartender's self-test

  # Pushes to main have no pull request to check.
  conventions:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/conventions.yml

  specs:
    name: Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: test/run.sh

  # So a Dependabot bump that breaks the image setup.sh runs in can't merge.
  setup-image:
    name: Setup image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build --tag dartender-setup - < scripts/setup/Dockerfile

  # Dartender's required check. Every repo runs whatever is on main, so this is the only gate.
  self-test-ok:
    needs: [ci, fixtures, publish, changelog, conventions, specs, setup-image]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: >-
            ci=${{ needs.ci.result }}
            fixtures=${{ needs.fixtures.result }}
            publish=${{ needs.publish.result }}
            changelog=${{ needs.changelog.result }}
            conventions=${{ needs.conventions.result }}
            specs=${{ needs.specs.result }}
            setup-image=${{ needs.setup-image.result }}
        run: echo "$RESULTS"
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
