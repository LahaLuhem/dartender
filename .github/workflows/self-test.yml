name: Self-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: self-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Dartender checks itself with the same workflow every package repo calls.
  ci:
    uses: ./.github/workflows/ci.yml

  # And against packages laid out like the real repos, since dartender itself has no pubspec.
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        fixture: [dart_package, flutter_package]
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: test/workflow_tests/${{ matrix.fixture }}
      # The fixtures aren't on Coveralls.
      coveralls: false

  specs:
    name: Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: test/run.sh

  # Dartender's required check. Every repo runs whatever is on main, so this is the only gate.
  self-test-ok:
    needs: [ci, fixtures, specs]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: >-
            ci=${{ needs.ci.result }}
            fixtures=${{ needs.fixtures.result }}
            specs=${{ needs.specs.result }}
        run: echo "$RESULTS"
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
