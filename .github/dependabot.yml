version: 2

updates:
  - package-ecosystem: github-actions
    # "/" alone only covers .github/workflows, and the composite actions live under actions/.
    directories: ["/", "/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /test
    schedule:
      interval: weekly
    commit-message:
      prefix: test

  # So the fixture's Android build keeps up with Flutter like a real repo's. detect.sh skips test/,
  # so the config check won't notice if this folder moves.
  - package-ecosystem: gradle
    directory: /test/workflow_tests/flutter_package/example/android
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: test

  - package-ecosystem: docker
    directory: /scripts/setup
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  # It has no dependencies to bump, but the Dependabot config check wants every pubspec watched.
  - package-ecosystem: pub
    directory: /lints
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  # Only mason, at whatever version runs the hook, but the check wants every pubspec watched.
  - package-ecosystem: pub
    directory: /bricks/callers/hooks
    schedule:
      interval: weekly
    commit-message:
      prefix: build
