version: 2

updates:
  - package-ecosystem: github-actions
    # "/" alone only covers .github/workflows, and the composite actions live under actions/.
    directories: ["/", "/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /test
    schedule:
      interval: weekly
    commit-message:
      prefix: test

  - package-ecosystem: docker
    directory: /scripts/setup
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  # It has no dependencies to bump, but the Dependabot config check wants every pubspec watched.
  - package-ecosystem: pub
    directory: /lints
    schedule:
      interval: weekly
    commit-message:
      prefix: build
