name: Changelog type
description: Finds the PR a pushed commit came from, and the changelog section its line goes under.

inputs:
  repo:
    description: The repository, as owner/name.
    required: true
  sha:
    description: The commit that was pushed.
    required: true
  label:
    description: >-
      A sem-* label to take instead of looking the PR up. Only dartender's self-test sets it, since
      its own PRs carry none.
    default: ""
  title:
    description: The title that goes with that label.
    default: ""

outputs:
  type:
    description: The cider type the line goes under, or empty when there's no line to write.
    value: ${{ steps.type.outputs.type }}
  title:
    description: The PR's title, which becomes the line.
    value: ${{ steps.type.outputs.title }}

runs:
  using: composite
  steps:
    - id: type
      shell: bash
      env:
        REPO: ${{ inputs.repo }}
        SHA: ${{ inputs.sha }}
        LABEL: ${{ inputs.label }}
        TITLE: ${{ inputs.title }}
        # gh won't call the API without a token, even for public repos.
        GH_TOKEN: ${{ github.token }}
      # The whole repo comes down with the action, so this reaches dartender's scripts/.
      run: '"$GITHUB_ACTION_PATH/../../scripts/ci/changelog-type.sh" >> "$GITHUB_OUTPUT"'
