name: Branch name
description: Fails on a branch that isn't named <type>/#<issue>-<name>.

inputs:
  branch:
    description: The pull request's branch.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
      run: '"$GITHUB_ACTION_PATH/../../scripts/ci/branch-name.sh"'
