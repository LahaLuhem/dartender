name: Setup Python (uv)
description: Installs uv with its cache, then the project's Python and locked dependencies.

inputs:
  working-directory:
    description: Folder of the Python project.
    default: .

runs:
  using: composite
  steps:
    # No major tags after v7, so this one is a full version. Left out, `version` takes the
    # project's `required-version`, or else the latest uv.
    - uses: astral-sh/setup-uv@v10.2.0
      with:
        working-directory: ${{ inputs.working-directory }}
        enable-cache: auto
        cache-dependency-glob: uv.lock

    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync --frozen
