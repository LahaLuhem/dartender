name: Setup Android
description: Installs the JDK for Flutter's Android builds, with the Gradle caches.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"
        java-package: jdk
        set-default: true

    # Its init scripts reach the Gradle `flutter build` starts.
    # No inputs: its defaults already save only on the default branch.
    - uses: gradle/actions/setup-gradle@v6
