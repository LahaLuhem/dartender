name: Setup Android
description: Installs the JDK for Flutter's Android builds, with the Gradle caches.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"
        java-package: jdk
        set-default: true
        cache: gradle
        # Only the default branch saves, see the README's Calling it.
        cache-read-only: >-
          ${{ github.event.repository != null
          && github.ref_name != github.event.repository.default_branch }}
