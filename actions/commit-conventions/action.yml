name: Commit conventions
description: Fails on a blank description, a merge commit, or an overlong subject.

inputs:
  body:
    description: The pull request's description.
    default: ""
  base:
    description: The commit the pull request starts from.
    required: true
  head:
    description: The pull request's last commit.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PR_BODY: ${{ inputs.body }}
        BASE_SHA: ${{ inputs.base }}
        HEAD_SHA: ${{ inputs.head }}
      run: '"$GITHUB_ACTION_PATH/../../scripts/ci/commit-conventions.sh"'
