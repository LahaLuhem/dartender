name: Check inputs
description: Fails when a step passes an input its action or reusable workflow doesn't declare.

inputs:
  working-directory:
    description: Folder of the package.
    default: .

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # gh won't call the API without a token, even for public repos.
        GH_TOKEN: ${{ github.token }}
      # The whole repo comes down with the action, so this reaches dartender's scripts/.
      run: '"$GITHUB_ACTION_PATH/../../scripts/ci/check-inputs.sh"'
