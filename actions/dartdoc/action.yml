name: Dartdoc
description: Fails unless dart doc comes back clean for every package the repo publishes.

inputs:
  working-directory:
    description: Folder of the repo's root.
    default: .

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: '"$GITHUB_ACTION_PATH/../../scripts/ci/dartdoc.sh"'
