name: Setup Flutter
description: Installs the Flutter from .fvmrc with its SDK and pub caches, then the dependencies.

inputs:
  working-directory:
    description: Folder of the package.
    default: .
  pub-get:
    description: Whether to run `flutter pub get` afterwards, true or false.
    default: "true"

runs:
  using: composite
  steps:
    # Pure Dart packages get Flutter too, so format and analyze see the same Dart in every repo.
    # subosito saves from any branch, so here it only works out the keys and paths.
    - id: flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        # One Flutter per repo, so the root's file, not the package folder's.
        flutter-version-file: .fvmrc
        dry-run: true
        cache: false
        pub-cache: false

    # Only the default branch saves, see the README's Calling it. The test is setup-gradle's
    # default for cache-read-only.
    - id: branch
      shell: bash
      env:
        READ_ONLY: >-
          ${{ github.event.repository != null
          && github.ref_name != github.event.repository.default_branch }}
      run: echo "read-only=$READ_ONLY" >> "$GITHUB_OUTPUT"

    - if: steps.branch.outputs.read-only == 'false'
      uses: actions/cache@v6
      with:
        path: ${{ steps.flutter.outputs.CACHE-PATH }}
        key: ${{ steps.flutter.outputs.CACHE-KEY }}
    - if: steps.branch.outputs.read-only == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.flutter.outputs.CACHE-PATH }}
        key: ${{ steps.flutter.outputs.CACHE-KEY }}

    # subosito's own key, so the default branch's entries keep hitting. A library commits no
    # lockfile, so pubspecs count too, and either change falls back to this Flutter's newest.
    - if: steps.branch.outputs.read-only == 'false'
      uses: actions/cache@v6
      with:
        path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
        key: >-
          ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-${{
          hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
        restore-keys: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}
    - if: steps.branch.outputs.read-only == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
        key: >-
          ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-${{
          hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
        restore-keys: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}

    # The dry run's version, so it uses the SDK just restored even if a release lands in between.
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ steps.flutter.outputs.VERSION }}
        dry-run: false
        cache: false
        pub-cache: false

    - if: inputs.pub-get == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: flutter pub get
