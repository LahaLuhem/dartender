name: Setup Flutter
description: Installs Flutter stable with its pub cache, then gets the package's dependencies.

inputs:
  working-directory:
    description: Folder of the package.
    default: .
  pub-get:
    description: Whether to run `flutter pub get` afterwards, true or false.
    default: "true"

runs:
  using: composite
  steps:
    # Pure Dart packages get Flutter too, so format and analyze see the same Dart in every repo.
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
        pub-cache: true

    - if: inputs.pub-get == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: flutter pub get
