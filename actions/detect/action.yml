name: Detect
description: Works out what's in a package repo, so ci.yml only runs the jobs that apply.

inputs:
  working-directory:
    description: Folder of the package.
    default: .

outputs:
  lint-checks:
    description: The lint matrix, as JSON.
    value: ${{ steps.detect.outputs.lint-checks }}
  lint-image:
    description: The linterpol image to lint with.
    value: ${{ steps.detect.outputs.lint-image }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # The whole repo comes down with the action, so this reaches dartender's scripts/.
      run: '"$GITHUB_ACTION_PATH/../../scripts/detect.sh" >> "$GITHUB_OUTPUT"'
