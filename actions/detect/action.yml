name: Detect
description: Works out what's in a package repo, so ci.yml only runs the jobs that apply.

inputs:
  working-directory:
    description: Folder of the package.
    default: .

outputs:
  lint-checks:
    description: The lint matrix, as JSON.
    value: ${{ steps.detect.outputs.lint-checks }}
  lint-image:
    description: The linterpol image to lint with.
    value: ${{ steps.detect.outputs.lint-image }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: '"$GITHUB_ACTION_PATH/detect.sh" >> "$GITHUB_OUTPUT"'

    - name: Summary
      shell: bash
      env:
        CHECKS: ${{ steps.detect.outputs.lint-checks }}
        IMAGE: ${{ steps.detect.outputs.lint-image }}
      run: |
        {
          echo "### What dartender found"
          echo "| What | Found |"
          echo "|---|---|"
          echo "| Linters | $(jq -r '[.[].name] | join(", ")' <<< "$CHECKS") |"
          echo "| Lint image | \`$IMAGE\` |"
        } >> "$GITHUB_STEP_SUMMARY"
