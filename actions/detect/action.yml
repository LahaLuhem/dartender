name: Detect
description: Works out what's in a package repo, so ci.yml only runs the jobs that apply.

inputs:
  working-directory:
    description: Folder of the package.
    default: .

outputs:
  lint-checks:
    description: The lint matrix, as JSON.
    value: ${{ steps.detect.outputs.lint-checks }}
  lint-image:
    description: The linterpol image to lint with.
    value: ${{ steps.detect.outputs.lint-image }}
  package:
    description: Whether there's a pubspec.yaml, true or false.
    value: ${{ steps.detect.outputs.package }}
  flutter:
    description: Whether the package depends on the Flutter SDK.
    value: ${{ steps.detect.outputs.flutter }}
  example:
    description: Whether there's an example app with its own pubspec.yaml.
    value: ${{ steps.detect.outputs.example }}
  example-tests:
    description: Whether that example has a test folder.
    value: ${{ steps.detect.outputs.example-tests }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # The whole repo comes down with the action, so this reaches dartender's scripts/.
      run: '"$GITHUB_ACTION_PATH/../../scripts/detect.sh" >> "$GITHUB_OUTPUT"'
